name: Plugin SDK release assets
on:
  push:
    tags: ['plugin-sdk-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-plugin-packages.mjs
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-sdk
          path: release/*.tgz
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --generate-notes
